name: LiquidAss local renderer macOS validation

on:
  push:
    branches:
      - 'research/local-renderer-ci-*'

permissions:
  contents: read

concurrency:
  group: local-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out the explicit public validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm Apple toolchain and download fixed SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          xcrun --sdk iphoneos clang --version
          command -v rg >/dev/null || brew install ripgrep
          mkdir -p "$RUNNER_TEMP/liquidass-sdk"
          cd "$RUNNER_TEMP/liquidass-sdk"
          git init
          git remote add origin https://github.com/theos/sdks.git
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk
          git fetch --depth 1 --filter=blob:none origin 0222fd5413cf4b9af096f37b4621afa2688572f7
          git checkout --detach FETCH_HEAD
          echo "SDK=$RUNNER_TEMP/liquidass-sdk/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
      - name: Build only the same-App local renderer validation on macOS
        shell: bash
        run: bash validation/nativeplay/build-macos.sh
      - name: Upload unsigned validation artifact and exact build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidAss-local-renderer-build16-UNSIGNED
          path: ci-artifacts/local-renderer-build16/
          if-no-files-found: error
          retention-days: 7
